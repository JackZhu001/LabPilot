[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "labpilot"
version = "0.1.0"
description = "Autonomous ML Research & Experimentation Agent with isolated Docker execution"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0,<2",
  "pydantic>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "mypy>=1.15,<2"]

[project.scripts]
labpilot = "labpilot.cli.app:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not docker'"
markers = ["docker: requires a running Docker daemon; may prepare an image over the network"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".labpilot"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.hatch.build.targets.wheel]
packages = ["src/labpilot"]
